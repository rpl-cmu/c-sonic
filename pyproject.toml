[project]
name = "c-sonic"
version = "1.0.0"
description = "C-SONIC: cross-modal sonar image correspondence with pose-supervised learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Akshay Hinduja" },
  { name = "Samiran Gode" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.4.0",
  "torchvision==0.19.0",
  "numpy>=1.26,<2",
  "opencv-python>=4.8,<5",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "configargparse>=1.5",
  "pyyaml>=6",
  "tqdm>=4.65",
]

[dependency-groups]
dev = ["pytest>=8"]
train = ["wandb>=0.15"]
notebook = ["jupyterlab>=4", "ipympl>=0.9", "ipywidgets>=8"]

[tool.uv]
# Flat research layout: scripts run from the repository root, nothing is installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: loads a checkpoint or runs a full network forward",
  "gpu: requires CUDA",
]
